version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: risk-monitoring-backend:latest
    container_name: risk-monitoring-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    # 不对外暴露端口，仅通过 nginx 访问
    expose:
      - "8000"
    volumes:
      # 数据持久化
      - ./backend/media:/app/backend/media
      - ./backend/logs:/app/backend/logs
      - ./backend/staticfiles:/app/backend/staticfiles
    networks:
      - risk-monitoring-network
    extra_hosts:
      # 允许容器访问宿主机上的 MySQL
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/swagger/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: risk-monitoring-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/staticfiles:/usr/share/nginx/html/static:ro
      - ./backend/media:/usr/share/nginx/html/media:ro
    networks:
      - risk-monitoring-network
    depends_on:
      web:
        condition: service_healthy

networks:
  risk-monitoring-network:
    driver: bridge

